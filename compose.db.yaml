services:
  postgres:
    # postgres:16-alpine was already present on the repo host. pgvector arrives with H4 (image not yet checked).
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lrh
      POSTGRES_USER: lrh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrh -d lrh"]
      interval: 3s
      timeout: 3s
      retries: 20
