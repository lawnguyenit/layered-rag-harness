services:
  postgres:
    # postgres:16-alpine was already present on the repo host. pgvector arrives with H4 (image not yet checked).
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lrh
      POSTGRES_USER: lrh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrh -d lrh"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Profile "api": `docker compose --profile api up -d --build --wait`. Plain `up` still starts only postgres.
  host-api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: host/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lrh:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env}@postgres:5432/lrh
      HOST_OIDC_ISSUER: ${HOST_OIDC_ISSUER:-}
      HOST_OIDC_AUDIENCE: ${HOST_OIDC_AUDIENCE:-}
      HOST_OIDC_JWKS_URL: ${HOST_OIDC_JWKS_URL:-}
    ports:
      - "127.0.0.1:8020:8020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
