[project]
name = "bepmay-host"
version = "0.0.1"
description = "Synthetic host system (Bếp Mây orders, tickets, invoices) that the harness plugs into. Owns its own data, auth and access rules."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.13,<2",
    "PyJWT[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bepmay_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
