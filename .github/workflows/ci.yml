name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run pytest -q

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: uv sync --frozen
      # Throwaway database, generated credentials, never published; the pgvector image carries the extension.
      - name: Start PostgreSQL with pgvector
        run: |
          OWNER_PW=$(openssl rand -hex 12); APP_PW=$(openssl rand -hex 12)
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$APP_PW"
          docker run -d --name pg -e POSTGRES_USER=lrh -e POSTGRES_PASSWORD="$OWNER_PW" -e POSTGRES_DB=lrh \
            -p 127.0.0.1:55432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 40); do docker exec pg pg_isready -U lrh -d lrh && break; sleep 2; done
          sleep 3
          echo "MIGRATE_DATABASE_URL=postgresql://lrh:$OWNER_PW@127.0.0.1:55432/lrh" >> "$GITHUB_ENV"
          echo "HOST_APP_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
          echo "HOST_TEST_DATABASE_URL=postgresql://lrh:$OWNER_PW@127.0.0.1:55432/lrh" >> "$GITHUB_ENV"
          echo "HOST_TEST_APP_DATABASE_URL=postgresql://bepmay_app:$APP_PW@127.0.0.1:55432/lrh" >> "$GITHUB_ENV"
      - run: uv run alembic upgrade head
      - run: uv run python -m bepmay_host.provision
      - run: uv run python -m bepmay_host.seed
        env:
          HOST_CORPUS_DIR: ../data/corpus
      - run: uv run python -m bepmay_host.ingest
        env:
          HOST_CORPUS_DIR: ../data/corpus
      - run: uv run pytest -q

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv sync --frozen
        working-directory: host
      - run: uv run python scripts/backup_restore_check.py
