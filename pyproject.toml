[project]
name = "layered-rag-harness"
version = "0.0.1"
description = "RAG document Q&A with access control, built layer by layer and measured on a fixed question set"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "google-genai>=2.33,<3",  # đã kiểm tên lớp/trường trên 2.33.0
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "PyJWT[crypto]>=2.10,<3",
    "tzdata>=2024.1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lrh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: gọi API thật, tốn lượt free; chỉ chạy khi có GEMINI_API_KEY và LRH_LIVE=1"]
